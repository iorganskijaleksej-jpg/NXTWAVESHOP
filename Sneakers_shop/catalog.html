<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXTWAVESHOP — Catalog</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="catalog-page bg-white text-ink antialiased pt-20">

  <header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-white/80 border-b border-black/[0.04]">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      
      <a href="index.html" class="text-xs sm:text-sm font-semibold tracking-[0.15em] uppercase text-ink shrink-0">
        NXTWAVESHOP
      </a>
      
      <div class="flex items-center gap-3 sm:gap-6">
        <a href="catalog.html" class="text-sm text-slate hover:text-ink font-medium transition-colors duration-200">
          Catalog
        </a>
        <a href="index.html#process" class="text-xs sm:text-sm text-slate hover:text-ink transition-colors duration-200">
          <span class="sm:hidden">Delivery</span>
          <span class="hidden sm:inline">Delivery &amp; Process</span>
        </a>
        <a href="index.html#faq" class="text-xs sm:text-sm text-slate hover:text-ink transition-colors duration-200">
          FAQ
        </a>
      </div>
  
      <button id="cart-toggle" class="relative p-2 -mr-2 hover:opacity-60 transition-opacity duration-200 shrink-0" aria-label="Open cart">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-ink" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" />
        </svg>
        <span id="cart-count" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-ink text-white text-[10px] font-medium rounded-full flex items-center justify-center hidden">0</span>
      </button>
  
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-xl sm:text-2xl font-bold uppercase tracking-wider mb-6">Footwear Catalog</h1>

    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-8">
    </div>
  </main>

  <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/45 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" aria-hidden="true">
    <div id="modal-backdrop" class="absolute inset-0"></div>
    <div class="relative bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl z-10 max-h-[90vh] overflow-y-auto">
      <button id="modal-close" class="absolute top-4 right-4 p-2 text-slate hover:text-ink transition-colors" aria-label="Close modal">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="cart-overlay" class="fixed inset-0 z-50 opacity-0 pointer-events-none transition-opacity duration-300" aria-hidden="true">
    <div id="cart-backdrop" class="absolute inset-0 bg-black/45 backdrop-blur-sm"></div>
    <aside class="absolute top-0 right-0 w-full max-w-md h-full bg-white shadow-2xl flex flex-col justify-between p-6 overflow-y-auto">
      <div>
        <div class="flex items-center justify-between pb-4 border-b border-black/[0.06]">
          <h2 class="text-lg font-bold uppercase tracking-wider">Your Cart</h2>
          <button id="cart-close" class="p-2 text-slate hover:text-ink transition-colors" aria-label="Close cart">✕</button>
        </div>
        
        <div id="cart-items" class="py-4 space-y-4"></div>
      </div>

      <div class="pt-4 border-t border-black/[0.06]">
        <div class="flex items-center justify-between mb-4">
          <span class="text-sm font-medium text-slate">Subtotal</span>
          <span id="cart-subtotal" class="text-base font-bold text-ink">0</span>
        </div>
        
        <form id="checkout-form" class="space-y-3">
          <input type="text" name="fullName" placeholder="Full Name" required class="w-full px-3 py-2 text-sm border border-black/10 rounded-xl focus:outline-none focus:border-ink">
          <input type="tel" name="phone" placeholder="Phone Number" required class="w-full px-3 py-2 text-sm border border-black/10 rounded-xl focus:outline-none focus:border-ink">
          <input type="email" name="email" placeholder="Email Address" required class="w-full px-3 py-2 text-sm border border-black/10 rounded-xl focus:outline-none focus:border-ink">
          <input type="text" name="address" placeholder="Delivery Address" required class="w-full px-3 py-2 text-sm border border-black/10 rounded-xl focus:outline-none focus:border-ink">
          
          <button type="submit" id="checkout-btn"
  class="w-full py-3.5 bg-black text-white text-sm font-medium rounded-full hover:bg-black/80 transition-colors duration-200 disabled:opacity-30 disabled:cursor-not-allowed">
  Checkout Order
</button>
<p class="text-[11px] text-slate text-center leading-relaxed mt-2">
  Secure payment. 100% refund if the required size is unavailable.
</p>
        </form>
      </div>
    </aside>
  </div>

  <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 bg-black text-white px-6 py-4 rounded-2xl text-sm font-medium shadow-2xl opacity-0 pointer-events-none transition-all duration-300 text-center max-w-sm"></div>
  
  <footer class="border-t border-black/[0.04] py-10 bg-white mt-16">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-6">
      
      <div class="text-center sm:text-left">
        <p class="text-xs font-semibold tracking-wider uppercase text-ink">NXTWAVESHOP</p>
        <p class="text-[11px] text-slate mt-1">© All rights reserved.</p>
      </div>

      <div class="flex items-center gap-6 sm:gap-8">
        <a href="index.html#process" class="text-xs text-slate hover:text-ink transition-colors duration-200">
          Delivery &amp; Process
        </a>
        <a href="index.html#faq" class="text-xs text-slate hover:text-ink transition-colors duration-200">
          FAQ
        </a>
      </div>

    </div>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
